name: Validate RAW Plugins

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quickjs-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run manifest and QuickJS contract tests
        run: npm test
